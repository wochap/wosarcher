# One machine with a GPU that fits every model at once; models stay resident.

[run]
gpu_policy = "shared"

[search]
provider = "searxng"
base_url = "http://localhost:8888"

[fetch]
provider = "firecrawl"
base_url = "http://localhost:3002/v1"

[prefilter]
provider = "embeddings"
base_url = "http://localhost:8002/v1"
model = "embeddings"
device = "local:gpu0"
batch_size = 64

[score]
provider = "rerank"
base_url = "http://localhost:8001/v1"
model = "reranker"
device = "local:gpu0"
batch_size = 32

[llm]
provider = "llm"
base_url = "http://localhost:8080/v1"
model = "writer"
device = "local:gpu0"
# Prompt processing of a large context, or a model load behind llama-swap,
# can take minutes before the first token.
timeout = 600.0
# Start llama-server with `-c` at least llm.context_window (`wosarcher doctor`
# checks it). Ollama: set max_tokens_field = "max_tokens" if it ignores
# max_completion_tokens.
