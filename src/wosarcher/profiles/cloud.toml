# No local models: hosted APIs with high concurrency. Keys come from the
# environment, for example WOSARCHER_LLM__API_KEY.

[run]
gpu_policy = "shared"

[search]
provider = "searxng"
base_url = "http://localhost:8888"
concurrency = 8

[fetch]
provider = "firecrawl"
base_url = "https://api.firecrawl.dev/v1"
concurrency = 16

[prefilter]
provider = "bm25"

[score]
provider = "jev"
base_url = "https://api.typesafe.ai/v1"
concurrency = 16
timeout = 120.0

[llm]
provider = "llm"
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
concurrency = 8
timeout = 300.0
