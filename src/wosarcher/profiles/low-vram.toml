description = "Models take turns on one small GPU; slower, fits 8 GB."
# One small GPU: models take turns, so the backend must be able to unload.

[run]
gpu_policy = "exclusive"

[search]
provider = "searxng"
base_url = "http://localhost:8888"

[fetch]
provider = "firecrawl"
base_url = "http://localhost:3002/v1"
concurrency = 2

[prefilter]
provider = "embeddings"
base_url = "http://localhost:8080/v1"
model = "embeddings"
device = "local:gpu0"
release = "llama-swap"
batch_size = 8
concurrency = 1

[score]
provider = "rerank"
base_url = "http://localhost:8080/v1"
model = "reranker"
device = "local:gpu0"
release = "llama-swap"
batch_size = 8
concurrency = 1

[llm]
provider = "llm"
base_url = "http://localhost:8080/v1"
model = "writer"
device = "local:gpu0"
release = "llama-swap"
concurrency = 1
# Prompt processing of a large context, or a model load behind llama-swap,
# can take minutes before the first token.
timeout = 600.0
# Start llama-server with `-c` at least llm.context_window (`wosarcher doctor`
# checks it). Ollama: set max_tokens_field = "max_tokens" if it ignores
# max_completion_tokens.
