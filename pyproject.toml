[project]
name = "wosarcher"
version = "0.1.0"
description = "Modular, scriptable research pipeline"
readme = "docs/design.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "markdown-it-py==4.2.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "rich==15.0.0",
    "typer==0.27.2",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
wosarcher = "wosarcher.cli:main"

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "httpx2==2.13.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["openspec", "docs", "design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.basedpyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
# Makes the `pyright: ignore` in tests/test_ports_typing.py an assertion that the error exists.
reportUnnecessaryTypeIgnoreComment = "error"
# Tests may exercise private helpers whose rules the specs fix (e.g. `lexical._select`).
executionEnvironments = [
    { root = "tests", extraPaths = [".", "src"], reportPrivateUsage = false },
    { root = "evals", extraPaths = [".", "src"] },
    { root = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
