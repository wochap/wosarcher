# Named ranking variants for `python -m evals.replay`. Each forks a recorded
# run from `chunk`, `prefilter`, `score`, or `write` with the given `--set` overrides. Model
# variants disable fallback so a broken service fails the fork; replay also
# marks a fork failed when its scorer or prefilter fell back.

[bm25]
from = "score"
set = ["score.provider=bm25"]

[bm25-wide]
from = "score"
set = ["score.provider=bm25", "score.relative_threshold=0.3", "score.top_k=25"]

[rerank]
from = "score"
set = ["score.provider=rerank", "score.fallback=[]"]

[jev]
from = "score"
set = ["score.provider=jev", "score.fallback=[]"]

[prefilter-embeddings]
from = "prefilter"
set = ["prefilter.provider=embeddings"]

[prefilter-bm25]
from = "prefilter"
set = ["prefilter.provider=bm25"]

# Scorer comparison with an explicit prefilter, so parents recorded with
# another prefilter compare on equal terms. Jev variants set the Jev endpoint
# and clear the model: a fork keeps the parent's score block, which may point
# at a reranker.
[embeddings-rerank]
from = "prefilter"
set = ["prefilter.provider=embeddings", "score.provider=rerank", "score.fallback=[]"]

[embeddings-jev]
from = "prefilter"
set = ["prefilter.provider=embeddings", "score.provider=jev", "score.base_url=\"https://api.typesafe.ai/v1\"", "score.model=\"\"", "score.concurrency=16", "score.fallback=[]"]

[bm25-jev]
from = "prefilter"
set = ["prefilter.provider=bm25", "score.provider=jev", "score.base_url=\"https://api.typesafe.ai/v1\"", "score.model=\"\"", "score.concurrency=16", "score.fallback=[]"]

# Jev keeping 5 per sub-query instead of 10: about the passage count the
# reranker's relative threshold selects, so precision compares at equal size.
[embeddings-jev-k5]
from = "prefilter"
set = ["prefilter.provider=embeddings", "score.provider=jev", "score.base_url=\"https://api.typesafe.ai/v1\"", "score.model=\"\"", "score.concurrency=16", "score.fallback=[]", "score.top_k=5"]

[bm25-jev-k5]
from = "prefilter"
set = ["prefilter.provider=bm25", "score.provider=jev", "score.base_url=\"https://api.typesafe.ai/v1\"", "score.model=\"\"", "score.concurrency=16", "score.fallback=[]", "score.top_k=5"]

# Jev with a loose threshold: rubric level 2 ("same topic, does not help
# answer") is kept down to 1.5.
[jev-loose]
from = "score"
set = ["score.provider=jev", "score.base_url=\"https://api.typesafe.ai/v1\"", "score.model=\"\"", "score.concurrency=16", "score.fallback=[]", "score.min_score=1.5"]

# Scoring text: the context line (title and heading path) before the body,
# or the body alone.
[context-header]
from = "prefilter"
set = ["prefilter.context=\"header\""]

[context-body]
from = "prefilter"
set = ["prefilter.context=\"body\""]

# Chunking comparison: re-chunk the parent's pages with the current code.
# Compare with a `prefilter` fork of the same parent on precision and
# faithfulness; chunk IDs differ, so overlap reads low.
[chunk-current]
from = "chunk"
set = []

# Writer comparison: fork a scored fork from `write` so a prompt change is
# measured on the same context; precision is identical by construction.
[write-current]
from = "write"
set = []

# Gap input comparison: the gap step with the plan's question parts, or with
# the coverage table alone. `research.gap_parts` is a temporary switch,
# removed once this is measured.
[gap-parts]
from = "prefilter"
set = ["research.gap_parts=true"]

[gap-scores]
from = "prefilter"
set = ["research.gap_parts=false"]
